name: Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'web/**'
  pull_request:
    paths-ignore:
      - 'web/**'
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  SQLX_VERSION: 0.8.0
  SQLX_FEATURES: "rustls,postgres"
  SQLX_FEATURES_KEY: "rustls-postgres"
  APP_USER: app
  APP_USER_PWD: secret
  APP_DB_NAME: lending-indexer

concurrency:
  group: tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (matrix)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.91.0", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust ${{ matrix.toolchain }}
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache sqlx-cli
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sqlx-cli-cache
          key: sqlx-cli-${{ runner.os }}-${{ env.SQLX_VERSION }}-${{ env.SQLX_FEATURES_KEY }}

      - name: Install sqlx-cli
        run: |
          SQLX_CLI_ROOT="$RUNNER_TEMP/sqlx-cli-cache"
          if [ ! -f "$SQLX_CLI_ROOT/bin/sqlx" ]; then
            cargo install sqlx-cli \
              --root "$SQLX_CLI_ROOT" \
              --version=${{ env.SQLX_VERSION }} \
              --features ${{ env.SQLX_FEATURES }} \
              --no-default-features \
              --locked
          fi
          echo "$SQLX_CLI_ROOT/bin" >> $GITHUB_PATH

      - name: Build contracts
        uses: ./.github/actions/build-contracts

      - name: Create app user in Postgres
        run: |
          # Create the application user
          CREATE_QUERY="CREATE USER ${APP_USER} WITH PASSWORD '${APP_USER_PWD}';"
          PGPASSWORD="password" psql -U "postgres" -h "localhost" -c "${CREATE_QUERY}"

          # Grant create db privileges to the app user
          GRANT_QUERY="ALTER USER ${APP_USER} CREATEDB;"
          PGPASSWORD="password" psql -U "postgres" -h "localhost" -c "${GRANT_QUERY}"

          # Expose the app connection string to all following steps
          echo "DATABASE_URL=postgres://${APP_USER}:${APP_USER_PWD}@localhost:5432/${APP_DB_NAME}" >> "$GITHUB_ENV"

      - name: Migrate database
        run:  |
          cd crates/indexer
          SKIP_DOCKER=true ./scripts/init_db.sh

      - name: Run indexer tests
        run: cargo test -p lending-indexer

      - name: Run session tests
        run: cargo test -p lending-session

      - name: Run simplex tests
        shell: bash
        run: |
          set -euo pipefail
          cd crates/contracts

          # `simplex test` wraps `cargo nextest` but always exits 0: it only
          # prints `Exit Status: <code>` (dropping nextest's output on
          # failure) or `Process terminated.` when nextest is killed by a
          # signal. Until that is fixed upstream, guard the step two ways:
          #   1. Capture the real exit code of `simplex test` via
          #      ${PIPESTATUS[0]} — `tee` would otherwise mask it, since a
          #      pipeline's exit status is the last command's.
          #   2. Grep the captured log for the wrapper's own status lines
          #      (becomes redundant once the wrapper propagates the exit
          #      code, but harmless).
          # `set +e` around the pipeline is required so the script does not
          # abort before we can read $rc.

          run_simplex_test() {
            local label="$1"
            shift
            local log="simplex-${label}.log"

            set +e
            simplex test --test-threads 2 "$@" 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e

            if [ "$rc" -ne 0 ] || grep -Eq '^(Exit Status: [1-9]|Process terminated)' "$log"; then
              echo "::error::simplex test (${label}) failed (rc=$rc)"
              exit 1
            fi
          }

          run_simplex_test default
          run_simplex_test no-simplex --no-simplex

      - name: Check that queries are fresh
        if: matrix.toolchain == 'stable'
        run: cargo sqlx prepare --workspace --check -- --all-targets
