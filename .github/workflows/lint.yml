name: Lint

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'web/**'
  pull_request:
    paths-ignore:
      - 'web/**'
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install simplex-cli
        uses: ./.github/actions/setup-smplx

      - name: Generate contract artifacts
        shell: bash
        run: |
          cd crates/contracts
          simplex install
          simplex build
          test -f src/artifacts/mod.rs

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
