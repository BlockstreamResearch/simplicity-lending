[package]
name = "lending-session"
version = "0.1.0"
edition = "2024"
description = "Simplicity Lending session lib"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[lints]
workspace = true

[dependencies]
lending-contracts = { path = "../contracts" }
lending-indexer = { path = "../indexer" }
smplx-std = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
anyhow = "1"
dotenvy = "0.15"
serial_test = "3"
sqlx = { version = "0.8.3", features = ["postgres", "runtime-tokio-rustls", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
